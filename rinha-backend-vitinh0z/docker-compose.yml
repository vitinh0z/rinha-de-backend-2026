version: '3.8'

services:
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 30M
    networks:
      - rinha-net

  api1:
    image: vitinh0z/rinha-fraud:latest
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 150M
    networks:
      - rinha-net

  api2:
    image: vitinh0z/rinha-fraud:latest
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 150M
    networks:
      - rinha-net

networks:
  rinha-net:
    driver: bridge
